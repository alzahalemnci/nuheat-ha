[project]
name = "nuheat-conductor"
version = "0.1.0"
description = "Home Assistant custom integration for Nuheat thermostats via the Chemelex OpenAPI v2"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.324",
    "aioresponses",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
